<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Heads or Tails — Free Online 3D Coin Flip Game</title>
    <meta
      name="description"
      content="Flip a realistic 3D coin online. Pick heads or tails, watch it spin, and track your wins, losses, and streaks. Free, fast, and works on any device."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://www.example.com/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Heads or Tails — Free Online 3D Coin Flip Game" />
    <meta
      property="og:description"
      content="Flip a realistic 3D coin online. Pick heads or tails and track your streak."
    />
    <meta property="og:url" content="https://www.example.com/" />
    <meta property="og:image" content="https://www.example.com/og-cover.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Heads or Tails — Free Online 3D Coin Flip Game" />
    <meta
      name="twitter:description"
      content="Flip a realistic 3D coin online. Pick heads or tails and track your streak."
    />
    <meta name="twitter:image" content="https://www.example.com/og-cover.png" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap"
      rel="stylesheet"
    />

    <!-- Google Identity Services — powers the "Continue with Google" button -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <!--
      AdSense: uncomment once the site is approved. Kept out of index.html
      until then so an unapproved snippet doesn't trip AdSense's own review.
      <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXXXXXX" crossorigin="anonymous"></script>
    -->

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Game",
        "name": "Heads or Tails Coin Flip",
        "description": "A free online coin flip game with a realistic 3D animation, score tracking, and flip history.",
        "genre": "Casual",
        "playMode": "SinglePlayer",
        "applicationCategory": "Game",
        "operatingSystem": "Any"
      }
    </script>
  </head>
  <body>
    <!-- Apply the saved theme before first paint to avoid a flash of the
         wrong theme. Dark is the default/original theme. -->
    <script>
      (function () {
        try {
          if (localStorage.getItem("coin_app_theme") === "light") {
            document.documentElement.setAttribute("data-theme", "light");
          }
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
